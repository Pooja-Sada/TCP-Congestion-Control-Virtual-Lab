<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP Simulation Results</title>
    <link rel="stylesheet" href="css/results.css">
</head>
<body>

    <div class="results-container">

        <header>
            <h1>TCP Congestion Control</h1>
            <p>Simulation Results and Performance Analysis</p>
        </header>

        <section class="results-section">
            <h2>Simulation Results</h2>

            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total RTT</h3>
                    <p id="totalRTT">0</p>
                </div>

                <div class="stat-card">
                    <h3>Maximum CWND</h3>
                    <p id="maxCWND">0</p>
                </div>

                <div class="stat-card">
                    <h3>Threshold</h3>
                    <p id="threshold">0</p>
                </div>

                <div class="stat-card">
                    <h3>Packet Loss</h3>
                    <p id="packetLoss">0</p>
                </div>
            </div>
        </section>

        <section class="graph-section">
            <h2>Congestion Window vs RTT</h2>
            <div class="graph-container">
                <canvas id="cwndChart"></canvas>
            </div>
        </section>

  <section class="quiz-section">

    <h2>TCP Congestion Control Quiz</h2>

    <p id="questionNumber"></p>

    <h3 id="question"></h3>

    <div id="options"></div>

    <button id="nextButton" onclick="nextQuestion()">
        Next Question
    </button>

    <button id="submitButton" onclick="submitQuiz()" style="display:none;">
        Submit Quiz
    </button>

    <div id="resultBox" style="display:none;">

        <h2>Quiz Result</h2>

        <h3 id="score"></h3>

        <div id="answerReview"></div>

        <button onclick="startNewQuiz()">
            Try Another Quiz
        </button>

    </div>

</section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script src="js/results.js"></script>

</body>
</html>
